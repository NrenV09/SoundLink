name: Deploy Sound Link to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure GitHub Pages (Auto-Enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || npm install

      - name: TypeScript Verification
        run: npm run lint

      - name: Build Single-File Offline Bundle & GitHub Pages Artifact
        run: npm run build:pages

      - name: Upload Standalone Single-File Offline HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundLink-Offline-Standalone-HTML
          path: dist/SoundLink_Offline.html
          retention-days: 30

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
